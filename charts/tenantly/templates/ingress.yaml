{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tenantly.fullname" . }}
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # An empty host means the rule matches every host.
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tenantly.fullname" . }}
                port:
                  name: http
{{- end }}
