{{- if eq .Values.secrets.mode "sealed" }}
# Rendered only in sealed mode. The SealedSecret controller decrypts it into a Secret of the same name.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "tenantly.secretName" . }}
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecrets.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "tenantly.secretName" . }}
      labels:
        {{- include "tenantly.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
