{{- if and (eq .Values.secrets.mode "plain") (not .Values.secrets.existingSecretName) }}
# Dev only. Values come from values.yaml placeholders. Use secrets.mode sealed for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tenantly.secretName" . }}
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://tenantly_app:%s@%s-postgres:5432/tenantly?sslmode=disable" (urlquery .Values.secrets.appDbPassword) .Release.Name | quote }}
  MIGRATE_DATABASE_URL: {{ printf "postgres://postgres:%s@%s-postgres:5432/tenantly?sslmode=disable" (urlquery .Values.secrets.postgresPassword) .Release.Name | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OAUTH_CLIENT_SECRET: {{ .Values.secrets.oauthClientSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  APP_DB_PASSWORD: {{ .Values.secrets.appDbPassword | quote }}
{{- end }}
