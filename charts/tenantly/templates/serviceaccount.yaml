{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "tenantly.fullname" .) .Values.serviceAccount.name }}
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
# The API never calls the Kubernetes API, so do not mount a token.
automountServiceAccountToken: false
{{- end }}
