{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tenantly.fullname" . }}
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tenantly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
