apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenantly.fullname" . }}-config
  labels:
    {{- include "tenantly.labels" . | nindent 4 }}
data:
  {{- if .Values.env }}
  # Values pass through tpl, so {{ "{{ .Release.Name }}" }} resolves in REDIS_URL.
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
  {{- end }}
