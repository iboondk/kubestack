# Default values for the tenantly chart. Every key is commented.
# Use values-kind.yaml, values-demo.yaml or values-sealed.yaml as overlays.

# Overrides the chart name used in resource names (default: the chart name).
nameOverride: ""

# Overrides the full resource name prefix (default: <release>-<chart>).
fullnameOverride: ""

image:
  # Image repository. tenantly-api is built locally from images/tenantly/Dockerfile.
  repository: tenantly-api
  # Image tag. dev is the tag that build-image.sh produces.
  tag: dev
  # Kubernetes imagePullPolicy. IfNotPresent suits locally loaded images.
  pullPolicy: IfNotPresent

# Number of API pod replicas. Two or more, so the chaos test can kill one pod.
replicaCount: 2

# Port the API container listens on. Must match HTTP_ADDR in env.
containerPort: 8080

api:
  # Command the API container runs. Must be an executable path inside the image.
  command: ["/app/api"]

migrate:
  # Run the migrate Job (requires postgres.enabled).
  enabled: true
  # Command the migrate init container runs. "up" applies pending migrations.
  command: ["/app/migrate", "up"]

probes:
  liveness:
    # HTTP path checked by the liveness probe. The Tenantly API serves /healthz.
    path: /healthz
    # Seconds to wait after the container starts before the first liveness check.
    initialDelaySeconds: 5
    # Seconds between liveness checks.
    periodSeconds: 10
    # Consecutive failures before the container is restarted.
    failureThreshold: 3
  readiness:
    # HTTP path checked by the readiness probe. The Tenantly API has no /readyz, so /healthz is used.
    path: /healthz
    # Seconds to wait after the container starts before the first readiness check.
    initialDelaySeconds: 2
    # Seconds between readiness checks.
    periodSeconds: 5
    # Consecutive failures before the pod is removed from the Service.
    failureThreshold: 3

resources:
  requests:
    # CPU request. Required by the HPA, which computes utilization against it.
    cpu: 100m
    # Memory request.
    memory: 64Mi
  limits:
    # CPU limit.
    cpu: 500m
    # Memory limit.
    memory: 256Mi

# Plain (non-secret) environment variables for the API. Values are passed through
# tpl, so {{ .Release.Name }} resolves. Set a key to null to remove it.
env:
  # Application environment. dev relaxes the JWT_SECRET length check in the Tenantly API.
  APP_ENV: dev
  # Address the HTTP server listens on. Must match containerPort.
  HTTP_ADDR: ":8080"
  # Redis connection URL. Points at the Redis Service created by this chart.
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  # OpenTelemetry exporter: stdout, otlp or none.
  OTEL_EXPORTER: stdout

secrets:
  # plain: the chart renders a Secret from the values below (dev only).
  # sealed: the chart renders a SealedSecret from sealedSecrets.encryptedData.
  mode: plain
  # Name of an existing Secret to use instead of the chart's Secret. When set in
  # plain mode, the chart does not render its own Secret. Leave empty by default.
  existingSecretName: ""
  # Password for the Postgres superuser. Placeholder only. Used in the Postgres
  # StatefulSet and in MIGRATE_DATABASE_URL.
  postgresPassword: change-me-postgres
  # Password for the tenantly_app login role. Placeholder only. Used in DATABASE_URL
  # and set by the migrate Job.
  appDbPassword: change-me-app-db
  # Secret used to sign JWTs. Placeholder only.
  jwtSecret: change-me-jwt-secret
  # OAuth client secret. Placeholder only. Copy real values from your own .env, never from git.
  oauthClientSecret: change-me-oauth-client-secret

sealedSecrets:
  # Encrypted values, keyed the same way as the plain secret keys. Produced by
  # scripts/seal-secrets.sh. Used only when secrets.mode is sealed.
  encryptedData: {}

postgres:
  # Run a dev-only Postgres StatefulSet in this namespace. Turn off to use an external database.
  enabled: true
  # Postgres image for the StatefulSet and the migrate Job's helper containers.
  image: postgres:16-alpine
  # Size of the PersistentVolumeClaim that holds the data directory.
  storage: 1Gi

redis:
  # Run a dev-only Redis Deployment in this namespace. Turn off to use an external Redis.
  enabled: true
  # Redis image for the Deployment.
  image: redis:7-alpine

service:
  # Service type for the API. ClusterIP is exposed through the Ingress.
  type: ClusterIP
  # Port the Service listens on. Targets the named container port http.
  port: 80

ingress:
  # Create an Ingress for the API.
  enabled: true
  # IngressClass name. traefik is installed by the platform layer.
  className: traefik
  # Host name to match. Empty matches all hosts, which is what kind needs for localhost.
  host: ""
  # Path prefix routed to the API.
  path: /

# Spread API pods across nodes with a soft topology constraint (kubernetes.io/hostname).
topologySpread: true

podSecurityContext:
  # Refuse to start a container that would run as root.
  runAsNonRoot: true
  # UID of the distroless nonroot user.
  runAsUser: 65532
  # GID of the distroless nonroot user.
  runAsGroup: 65532
  seccompProfile:
    # Use the container runtime's default seccomp profile.
    type: RuntimeDefault

securityContext:
  # Mount the container root filesystem read-only. /tmp is an emptyDir.
  readOnlyRootFilesystem: true
  # Block privilege escalation through setuid binaries.
  allowPrivilegeEscalation: false
  capabilities:
    # Drop all Linux capabilities from the API container.
    drop: ["ALL"]

serviceAccount:
  # Create a dedicated ServiceAccount for the API pods.
  create: true
  # Name of the ServiceAccount. Empty uses the fullname.
  name: ""

hpa:
  # Create a HorizontalPodAutoscaler for the API (CPU and external RPS metrics).
  # When enabled, the Deployment omits spec.replicas and the HPA owns the count.
  enabled: true
  # Lower bound on replicas.
  minReplicas: 2
  # Upper bound on replicas.
  maxReplicas: 6
  # Target average CPU utilization, as a percentage of the CPU request.
  cpuAverageUtilization: 70
  rps:
    # Add the External RPS metric to the HPA. Served by prometheus-adapter.
    enabled: true
    # External metric name exposed by prometheus-adapter (see platform/prometheus-adapter-values.yaml).
    metricName: tenantly_requests_per_second
    # Target requests per second per pod (AverageValue). Quoted so YAML keeps it a string.
    averageValue: "20"
  behavior:
    # Scale up without delay, at most 2 pods every 30 seconds.
    scaleUp:
      stabilizationWindowSeconds: 0
      policyType: Pods
      value: 2
      periodSeconds: 30
    # Scale down only after 60 seconds of lower demand, at most 50 percent every 30 seconds.
    scaleDown:
      stabilizationWindowSeconds: 60
      policyType: Percent
      value: 50
      periodSeconds: 30

pdb:
  # Create a PodDisruptionBudget for the API, so voluntary disruptions keep pods running.
  enabled: true
  # Minimum number of API pods that must stay available during voluntary disruptions.
  minAvailable: 1

metrics:
  # Create a ServiceMonitor for the API's own metrics endpoint. Off by default: the Tenantly API has
  # no /metrics endpoint yet. values-demo.yaml turns it on for podinfo.
  enabled: false
  # HTTP path Prometheus scrapes.
  path: /metrics
  # Named Service port to scrape (the Service port is named http).
  port: http
  # Scrape interval.
  interval: 15s

dashboards:
  # Ship Grafana dashboards (charts/tenantly/dashboards/*.json) as a ConfigMap.
  enabled: true
  # Label the Grafana sidecar watches for.
  label: grafana_dashboard
  # Value of that label. The sidecar picks up ConfigMaps whose label matches this value.
  labelValue: "1"
  # Grafana folder the dashboards are loaded into.
  folder: Kubestack
