apiVersion: v1
kind: Service
metadata:
  name: tenantly
  labels:
    helm.sh/chart: tenantly-0.1.0
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubestack
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/component: api
---
# Source: tenantly/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantly
  labels:
    helm.sh/chart: tenantly-0.1.0
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubestack
    # Lets scripts/chaos.sh find the API Deployment by label, as it already does for the pods.
    app.kubernetes.io/component: api
  annotations:
    # Sync after postgres and redis (wave 0) and after the migrate Job (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tenantly
      app.kubernetes.io/instance: tenantly
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Changing the ConfigMap changes this hash, which rolls the pods.
        checksum/config: 385606f7e8fd48080281b0b4d95dd10d0bcd2866539adbd06a9dfe0516e6559e
      labels:
        helm.sh/chart: tenantly-0.1.0
        app.kubernetes.io/name: tenantly
        app.kubernetes.io/instance: tenantly
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: kubestack
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: tenantly
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tenantly
              app.kubernetes.io/instance: tenantly
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "ghcr.io/stefanprodan/podinfo:6.7.0"
          imagePullPolicy: IfNotPresent
          command:
            - ./podinfo
            - --port=9898
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tenantly-config
            - secretRef:
                name: tenantly-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            # The root filesystem is read-only, so /tmp is a writable emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
