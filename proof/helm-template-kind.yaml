# Dev-only Postgres. Data lives in a PVC. Replace with a managed database for anything real.
apiVersion: v1
kind: Service
metadata:
  name: tenantly-postgres
  labels:
    helm.sh/chart: tenantly-0.1.0
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubestack
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Headless, as required by the StatefulSet. DNS resolves to the single pod.
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/component: postgres
