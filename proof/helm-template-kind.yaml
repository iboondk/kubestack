# Source: tenantly/templates/migrate-job.yaml
# Runs the schema migrations, then sets the tenantly_app login password.
# Argo CD runs it as a Sync hook at wave 1, after postgres (wave 0) and before the API (wave 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenantly-migrate
  labels:
    helm.sh/chart: tenantly-0.1.0
    app.kubernetes.io/name: tenantly
    app.kubernetes.io/instance: tenantly
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubestack
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        helm.sh/chart: tenantly-0.1.0
        app.kubernetes.io/name: tenantly
        app.kubernetes.io/instance: tenantly
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: kubestack
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: tenantly
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1. Wait until Postgres accepts connections.
        - name: wait-for-db
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h tenantly-postgres -p 5432 -U postgres; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # 2. Apply the schema migrations with the app image.
        - name: migrate
          image: "tenantly-api:dev"
          imagePullPolicy: Never
          command:
            - /app/migrate
            - up
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tenantly-secrets
                  key: MIGRATE_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        # Main container: grant LOGIN to tenantly_app. Migration 00001 creates the role as NOLOGIN.
        - name: set-app-role-password
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -v pw="$APP_DB_PASSWORD" <<'SQL'
              ALTER ROLE tenantly_app LOGIN PASSWORD :'pw';
              SQL
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tenantly-secrets
                  key: MIGRATE_DATABASE_URL
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenantly-secrets
                  key: APP_DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
