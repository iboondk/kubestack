# Applied by scripts/bootstrap-argocd.sh after the Argo CD install manifests are ready.
# Teaches Argo CD how to judge the health of an Application. The parent app
# (kubestack-root) waits for each child app to report Healthy before it moves on to the
# next sync wave, so waves -3, -2, -1 and 0 really run in order.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
